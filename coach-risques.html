 le segment public, la valeur en jeu, donc un enjeu. Un vrai risque nommerait la cause et l'événement : par exemple, « si on rate le jalon de conformité de juin, le client peut résilier ».`,confusionMessages:{risque:`La forme ressemble à un risque, mais ce qui est dit c'est ce qu'on peut perdre, pas l'événement qui le ferait perdre. Ici on est sur un enjeu parce qu'on nomme la valeur en jeu (la crédibilité). Le risque dirait : « si on rate le jalon de juin, le client peut partir ».`},theme:`conseil`},{id:u(`triage-014`),mechanic:m.TRI,signature:{trapPattern:`enjeu-pur`,theme:`rh`},statement:`Au-delà du chiffre, ce qui compte c'est qu'on reste fidèles à la promesse qu'on a faite aux soignants lors du lancement.`,expected:`enjeu`,rationale:`Valeur qualitative, identitaire, antérieure à toute mesure. Pas d'événement, pas de cible, pas d'écart constaté. Pur enjeu, exprimé en langue de réunion.`,confusionMessages:{objectif:`Ce n'est pas un objectif parce qu'il n'y a rien à mesurer, rien à atteindre, juste une fidélité à préserver. Ici on est sur un enjeu parce que c'est la raison qui orientera les objectifs (par exemple : taux de satisfaction soignants, ou nombre d'engagements respectés).`},theme:`rh`},{id:u(`triage-002`),mechanic:m.TRI,signature:{trapPattern:`objectif-mesurable`,theme:`operations`},statement:`On veut faire passer le taux de réponse aux sollicitations support de 72 % à 90 % avant fin septembre.`,expected:`objectif`,rationale:`Cible chiffrée, échéance, verbe d'atteinte. Répond au « quoi vise-t-on ». Pas d'incertitude formulée.`,confusionMessages:{enjeu:`Ce n'est pas un enjeu parce qu'il y a déjà une cible et une échéance, quelqu'un a tranché ce qu'on vise. Ici on est sur un objectif parce que c'est mesurable et daté. L'enjeu serait derrière : pourquoi ce taux compte.`},theme:`operations`},{id:u(`triage-010`),mechanic:m.TRI,signature:{trapPattern:`confusion-enjeu-objectif`,theme:`conseil`},statement:`Notre objectif de satisfaction client, c'est d'arriver à 4,5 sur 5 sur les sondages post-mission d'ici la fin du PI.`,expected:`objectif`,rationale:`Le mot « satisfaction client » fait penser à un enjeu qualitatif. Pour distinguer enjeu et objectif quand un mot valeur apparaît, posez-vous : « y a-t-il une cible chiffrée ou une échéance ? ». Si oui, c'est un objectif. Si non, c'est un enjeu. Ici, 4,5/5 sur les sondages d'ici fin de PI = deux marqueurs mesurables = objectif. L'enjeu derrière, ce serait la fidélisation ou la préférence de marque, formulés sans chiffre parce que qualitatifs.`,confusionMessages:{enjeu:`La satisfaction client peut être un enjeu, mais ici elle est cadrée : 4,5/5 d'ici fin de PI. Ici on est sur un objectif parce qu'il y a une cible et une date. L'enjeu derrière, ce serait la fidélisation ou la réputation.`},theme:`conseil`},{id:u(`triage-011`),mechanic:m.TRI,signature:{trapPattern:`objectif-deguise-en-risque`,theme:`logiciel`},statement:`Notre principal risque, c'est de ne pas livrer la V2 le 30 septembre.`,expected:`objectif`,rationale:`Piège classique : la phrase commence par « risque » mais reformule seulement l'objectif raté. Ici, l'objectif est : livrer la V2 le 30 septembre. Pour trouver le vrai risque, posez-vous la question : « qu'est-ce qui pourrait empêcher cette livraison ? » ou « de quoi dépend-elle, et qu'est-ce qui est fragile ? ». Vous nommerez alors une cause précise (par exemple : la dépendance à l'équipe Paiement n'est pas planifiée dans leur PI), un événement incertain (leur module pourrait ne pas être prêt), une conséquence mesurable (glissement de trois semaines sur la roadmap).`,confusionMessages:{risque:`Ce n'est pas un risque parce qu'il n'y a ni cause ni événement, juste l'envers d'un objectif. Ici on est sur l'objectif lui-même, formulé en négatif. Un risque dirait pourquoi on pourrait ne pas livrer (ex : la dépendance paiement n'est pas levée).`},theme:`logiciel`},{id:u(`triage-015`),mechanic:m.TRI,signature:{trapPattern:`objectif-mesurable`,theme:`rh`},statement:`D'ici décembre, on vise à former 80 % des managers de proximité au nouveau processus d'entretien annuel.`,expected:`objectif`,rationale:`Cible, périmètre, échéance. Aucune incertitude formulée, aucun enjeu nommé.`,confusionMessages:{enjeu:`Ce n'est pas un enjeu parce que c'est mesurable et daté. Ici on est sur un objectif parce qu'on vise une cible précise. L'enjeu serait derrière : la qualité du dialogue managérial.`},theme:`rh`},{id:u(`triage-018`),mechanic:m.TRI,signature:{trapPattern:`objectif-mesurable`,theme:`operations`},statement:`L'OKR de l'équipe ce trimestre : réduire de moitié le délai entre la commande et l'expédition sur les commandes B2B.`,expected:`objectif`,rationale:`Cible explicite (de moitié), périmètre (B2B), horizon (trimestre). Le terme OKR renforce le cadre, mais l'énoncé tient seul comme objectif mesurable.`,confusionMessages:{enjeu:`Ce n'est pas un enjeu parce qu'il y a une cible chiffrée et un horizon. Ici on est sur un objectif. L'enjeu derrière serait par exemple : la compétitivité face à un concurrent qui livre en J+1.`},theme:`operations`},{id:u(`triage-003`),mechanic:m.TRI,signature:{trapPattern:`risque-canonique`,theme:`industriel`},statement:`Si le nouveau règlement européen sur les batteries entre en application avant qu'on ait validé notre cellule, on devra revoir toute la chaîne d'assemblage.`,expected:`risque`,rationale:`Conditionnel explicite, cause (calendrier réglementaire) + événement incertain + conséquence. Anatomie complète, pas encore avéré.`,confusionMessages:{issue:`Ce n'est pas une issue parce que le règlement n'est pas encore en vigueur, rien n'est constaté. Ici on est sur un risque parce que l'événement est conditionnel : ça pourrait arriver, et alors on devrait agir.`},theme:`industriel`},{id:u(`triage-007`),mechanic:m.TRI,signature:{trapPattern:`risque-canonique`,theme:`logiciel`},statement:`Si Marc part en arrêt comme l'an dernier en mars, on n'a personne qui sait reprendre la maintenance du moteur de règles.`,expected:`risque`,rationale:`Cause identifiée (mono-compétence), événement incertain (arrêt de Marc), conséquence claire (continuité de service). Forme canonique en langue d'équipe.`,confusionMessages:{issue:`Ce n'est pas une issue parce que Marc n'est pas en arrêt aujourd'hui, on est dans le conditionnel. Ici on est sur un risque parce que l'événement peut survenir, et c'est précisément maintenant qu'on peut agir dessus (binôme, doc, formation).`},theme:`logiciel`},{id:u(`triage-013`),mechanic:m.TRI,signature:{trapPattern:`risque-canonique`,theme:`evenementiel`},statement:`Avec deux personnes du staff covid+ à J-3, on pourrait se retrouver sous-staffé à l'accueil samedi si une troisième tombe.`,expected:`risque`,rationale:`Cause documentée (contagion en cours), événement incertain (3e cas), conséquence opérationnelle (accueil sous-staffé). La présence des deux cas avérés ne suffit pas à transformer ça en issue ; ce qui est nommé reste un événement futur conditionnel.`,confusionMessages:{issue:`Les deux cas covid+ sont des faits, mais ici la phrase porte sur le sous-staffing potentiel de samedi, pas sur ce qui est constaté. Ici on est sur un risque parce que l'événement (3e cas) est encore conditionnel.`},theme:`evenementiel`},{id:u(`triage-016`),mechanic:m.TRI,signature:{trapPattern:`confusion-issue-risque`,theme:`conseil`},statement:`Le fournisseur menace de ne pas livrer le module logistique à temps si on ne valide pas le cahier des charges cette semaine.`,expected:`risque`,rationale:`Piège : le verbe « menace » induit en erreur en sonnant comme un fait présent. Pour trancher, posez-vous : « le fait est-il déjà constaté, ou seulement annoncé comme possible ? ». Ici, la non-livraison n'est pas avérée : elle est annoncée sous condition. C'est donc un risque. Bonus pédagogique : la cause est activable (valider les specs cette semaine), ce qui rend la mitigation directement actionnable en atelier.`,confusionMessages:{issue:`Ce n'est pas une issue parce que la non-livraison n'est pas constatée, elle est annoncée comme possible. Ici on est sur un risque parce que l'événement reste conditionnel, et on a même un levier sur la cause (valider cette semaine).`},theme:`conseil`},{id:u(`triage-004`),mechanic:m.TRI,signature:{trapPattern:`issue-avere-passe`,theme:`logiciel`},statement:`Hier soir le service de paiement est tombé pendant 47 minutes, on a perdu environ 1 200 transactions.`,expected:`issue`,rationale:`Passé constaté, faits chiffrés, plus aucune incertitude. C'est un problème avéré à traiter, pas un risque à surveiller.`,confusionMessages:{risque:`Ce n'est pas un risque parce que c'est déjà arrivé : passé, chiffré, fini. Ici on est sur une issue parce qu'il n'y a plus rien à évaluer en probabilité, il y a à traiter.`},theme:`logiciel`},{id:u(`triage-005`),mechanic:m.TRI,signature:{trapPattern:`issue-avere-present`,theme:`industriel`},statement:`Notre taux de rebut sur la ligne 3 est à 14 % depuis lundi, on tourne normalement à 3 %.`,expected:`issue`,rationale:`Présent constaté, écart mesuré, durée installée. Le problème est là, maintenant.`,confusionMessages:{risque:`Ce n'est pas un risque parce que l'écart est constaté, pas anticipé : on est passés de 3 % à 14 %, c'est mesuré. Ici on est sur une issue parce que c'est la situation présente, pas un futur conditionnel.`},theme:`industriel`},{id:u(`triage-008`),mechanic:m.TRI,signature:{trapPattern:`confusion-enjeu-issue`,theme:`operations`},statement:`Notre crédibilité auprès de Carrefour est en train d'en prendre un coup : ils nous ont signifié hier qu'ils suspendent les commandes le temps qu'on clarifie.`,expected:`issue`,rationale:`Piège classique : le mot « crédibilité » déclenche le réflexe « enjeu ». Pour lever l'ambiguïté quand un mot valeur (crédibilité, sécurité, image) apparaît dans un énoncé, posez-vous la question : « est-ce que je nomme la valeur qui est en jeu, ou est-ce que je nomme un fait qui l'a déjà affectée ? ». Ici, la suspension des commandes est signifiée et datée d'hier : c'est une issue. La crédibilité chez Carrefour reste l'enjeu qu'on cherche à préserver, mais ce qui est devant nous à traiter maintenant, c'est le fait.`,confusionMessages:{enjeu:`L'enjeu de crédibilité existe bien, mais ici on parle d'un fait : Carrefour a suspendu les commandes hier. Ici on est sur une issue parce que c'est constaté et daté. L'enjeu, c'est ce qui est attaqué ; l'issue, c'est l'attaque qui a eu lieu.`},theme:`operations`},{id:u(`triage-009`),mechanic:m.TRI,signature:{trapPattern:`confusion-issue-risque`,theme:`logiciel`},statement:`Sur la dernière itération le binôme front bloque sur l'API d'auth, ils n'avancent plus depuis trois jours.`,expected:`issue`,rationale:`Piège : « bloque » peut sembler une menace en cours plutôt qu'un fait avéré. Pour trancher entre risque et issue, cherchez les marqueurs temporels et les faits constatés. Les mots « depuis », « hier », « en cours », un chiffre déjà mesuré désignent une issue. Les mots « si », « pourrait », « en cas de » désignent un risque. Ici, « depuis trois jours » ferme l'incertitude : c'est une issue à traiter, pas un risque à évaluer en probabilité.`,confusionMessages:{risque:`Ce n'est pas un risque parce qu'il n'y a pas d'incertitude : le blocage dure depuis trois jours, c'est constaté. Ici on est sur une issue parce que l'événement s'est produit et continue. À traiter, pas à évaluer en probabilité.`},theme:`logiciel`},{id:u(`triage-017`),mechanic:m.TRI,signature:{trapPattern:`issue-avere-present`,theme:`logiciel`},statement:`On vient de découvrir que les sauvegardes ne tournaient plus depuis fin avril sur l'environnement de pré-prod.`,expected:`issue`,rationale:`Fait découvert mais déjà installé. « Depuis fin avril » ferme l'incertitude. Le risque latent (perte de données) s'est déjà partiellement réalisé (deux mois sans sauvegarde).`,confusionMessages:{risque:`Ce n'est pas un risque parce que la défaillance dure depuis deux mois, c'est constaté. Ici on est sur une issue parce que le problème est avéré. Le risque associé (perte de données si incident) reste à formuler à côté, mais ce qui est nommé ici, c'est le fait.`},theme:`logiciel`}],Jt=Vt(h),Yt=Vt([`logiciel`,`evenementiel`,`industriel`,`conseil`,`rh`,`operations`]),Xt=F({trapPattern:P().min(1),theme:P().min(1)}),Zt=Bt(m.DETECTIVE),Qt=F({cause:P().min(5),event:P().min(5),consequence:P().min(5)}),$t=F({id:P().min(1),mechanic:Zt,signature:Xt,scenario:P().min(10,`Le scénario doit faire au moins 10 caractères.`),revealedComponent:Jt,revealedText:P().min(5,`Le texte révélé est trop court.`),expected:Qt,defensibleVariant:Qt,advice:zt(Jt,P().min(10)).refine(e=>Object.keys(e).length>=1,{message:`Au moins un conseil pédagogique (sur un composant à produire) est requis.`}),theme:Yt});function en(e){return e.map((e,t)=>{let n=$t.safeParse(e);if(!n.success){let e=n.error.issues.map(e=>`${e.path.join(`.`)||`(root)`} : ${e.message}`).join(`
  `);throw Error(`Item de corpus Chain #${t} invalide :\n  ${e}`)}return n.data})}var tn=[{id:u(`chain-001`),mechanic:m.DETECTIVE,signature:{trapPattern:`chaine-canonique`,theme:`logiciel`},scenario:`Slack #pi-planning : « Heads up : Marie part en congé maternité fin août, on n'a pas encore identifié qui reprendra le pilotage du chantier Espace Client côté métier. »`,revealedComponent:`cause`,revealedText:`le départ de Marie en congé maternité fin août sans relais métier identifié`,expected:{cause:`le départ de Marie en congé maternité fin août sans relais métier identifié`,event:`les décisions métier sur le chantier Espace Client pourraient ne plus être tranchées au rythme du sprint`,consequence:`on prendrait deux à trois sprints de retard sur la roadmap V2`},defensibleVariant:{cause:`le départ de Marie en congé maternité fin août sans relais métier identifié`,event:`le chantier Espace Client pourrait se retrouver sans interlocuteur métier pendant plusieurs semaines`,consequence:`la roadmap V2 glisserait d'au moins un mois sur les jalons d'octobre`},advice:{event:`Il doit s'écrire au conditionnel (pourrait, risquerait de). Tendance fréquente à écrire « les décisions métier ne sont plus tranchées » au présent : ce serait déjà une issue, pas un risque.`,consequence:`Nomme un effet mesurable sur l'objectif (sprints, jalons, périmètre). Évite « ça va ralentir », trop flou pour servir au pilotage.`},theme:`logiciel`},{id:u(`chain-002`),mechanic:m.DETECTIVE,signature:{trapPattern:`cause-distincte-de-l-evenement`,theme:`evenementiel`},scenario:`Réunion préparation festival : « Pour le festival d'août, on a appris ce matin que le préfet n'a toujours pas signé l'arrêté d'occupation du domaine public, alors que la deadline était il y a deux semaines. »`,revealedComponent:`cause`,revealedText:`l'arrêté préfectoral d'occupation du domaine public non signé à deux semaines de l'événement`,expected:{cause:`l'arrêté préfectoral d'occupation du domaine public non signé à deux semaines de l'événement`,event:`la préfecture pourrait refuser l'autorisation ou la délivrer trop tard pour monter le site`,consequence:`on devrait annuler ou déplacer le festival, avec une perte sèche estimée à 80 k€ d'avances déjà engagées`},defensibleVariant:{cause:`l'arrêté préfectoral d'occupation du domaine public non signé à deux semaines de l'événement`,event:`le délai d'instruction administrative pourrait dépasser la date de montage du site`,consequence:`on perdrait les avances versées aux prestataires (scène, sécurité, son) sans recours`},advice:{event:`Ne reformule pas la cause. L'événement est ce que cette cause rend possible : un refus ou un retard d'instruction. C'est le piège fréquent : recopier la cause en la conjuguant autrement.`,consequence:`Un montant ou une décision opérationnelle (annulation, déplacement) parle plus que « ce serait catastrophique ».`},theme:`evenementiel`},{id:u(`chain-003`),mechanic:m.DETECTIVE,signature:{trapPattern:`cause-vs-constat`,theme:`industriel`},scenario:`Compte-rendu daily atelier : « Sur la ligne d'embouteillage 2, le capteur de niveau remonte des valeurs aberrantes une fois sur cinq depuis lundi. Le technicien dit que c'est un faux contact mais on n'a pas eu le temps de l'isoler. »`,revealedComponent:`cause`,revealedText:`un faux contact intermittent sur le capteur de niveau de la ligne 2, identifié mais non isolé`,expected:{cause:`un faux contact intermittent sur le capteur de niveau de la ligne 2, identifié mais non isolé`,event:`le système de remplissage pourrait surdoser ou sous-doser un lot sans déclencher l'alerte`,consequence:`on devrait mettre en quarantaine puis détruire le lot concerné, soit environ 8 heures de production`},defensibleVariant:{cause:`un faux contact intermittent sur le capteur de niveau de la ligne 2, identifié mais non isolé`,event:`un lot entier pourrait sortir hors-tolérances sans que la chaîne ne s'arrête`,consequence:`on perdrait une journée de production sur la ligne 2 et on ouvrirait une non-conformité qualité`},advice:{event:`Décris ce qui pourrait se produire à cause du faux contact, pas l'état du capteur. « Le capteur est défaillant » serait un constat, donc une cause reformulée, pas un événement.`,consequence:`Chiffre l'impact (heures de production, lot, coût). Une conséquence qui se mesure permet d'arbitrer ; une conséquence vague ne le permet pas.`},theme:`industriel`},{id:u(`chain-004`),mechanic:m.DETECTIVE,signature:{trapPattern:`chaine-canonique`,theme:`operations`},scenario:`Slack équipe produit : « Mois prochain on lance la nouvelle tarification. L'équipe support n'a pas encore été formée et le script de réponses types n'est pas finalisé. »`,revealedComponent:`event`,revealedText:`le support pourrait être submergé par des demandes auxquelles il ne saurait pas répondre dans les 48 premières heures du lancement`,expected:{cause:`l'absence de formation du support et de script de réponses sur la nouvelle tarification à un mois du lancement`,event:`le support pourrait être submergé par des demandes auxquelles il ne saurait pas répondre dans les 48 premières heures du lancement`,consequence:`le délai moyen de réponse passerait de 4 h à plus de 24 h et on remonterait probablement 15 à 20 % d'insatisfaction sur la semaine de lancement`},defensibleVariant:{cause:`l'équipe support n'est ni formée ni équipée de réponses types pour la nouvelle tarification, à un mois de la mise en ligne`,event:`le support pourrait être submergé par des demandes auxquelles il ne saurait pas répondre dans les 48 premières heures du lancement`,consequence:`on traiterait moins d'un ticket sur deux dans la SLA habituelle pendant la semaine de bascule`},advice:{cause:`Nomme un facteur, pas un constat. « Le support est mauvais » est un jugement, pas une cause. Cherche ce qui n'est pas en place : formation, outillage, ressources, calendrier.`,consequence:`Chiffre, ou nomme un effet visible (SLA, insatisfaction, taux). Évite « ce serait compliqué », non mesurable, non actionnable.`},theme:`operations`},{id:u(`chain-005`),mechanic:m.DETECTIVE,signature:{trapPattern:`cause-vs-constat`,theme:`logiciel`},scenario:`PI Planning Day 1, post-it ROAM : « Notre équipe dépend du module d'authentification que livre l'équipe Plateforme. Leur PI Objective ne mentionne pas notre cas d'usage et on n'a pas eu d'arbitrage RTE encore. »`,revealedComponent:`event`,revealedText:`l'équipe Plateforme pourrait livrer son module d'authentification sans le scope nécessaire à notre cas d'usage`,expected:{cause:`l'absence d'engagement explicite de l'équipe Plateforme sur notre cas d'usage dans son PI Objective, et l'absence d'arbitrage RTE`,event:`l'équipe Plateforme pourrait livrer son module d'authentification sans le scope nécessaire à notre cas d'usage`,consequence:`nos deux features dépendantes glisseraient au PI suivant, soit trois mois de retard sur la roadmap`},defensibleVariant:{cause:`notre cas d'usage n'est pas pris en compte dans le PI Objective de Plateforme et la priorisation n'a pas été tranchée par le RTE`,event:`l'équipe Plateforme pourrait livrer son module d'authentification sans le scope nécessaire à notre cas d'usage`,consequence:`on devrait reporter de trois mois les features qui dépendent de cette brique`},advice:{cause:`Un facteur, pas un constat. « L'équipe Plateforme ne nous écoute pas » est un jugement. La cause utile est ce qui est ou n'est pas dans leurs engagements et dans les arbitrages.`,consequence:`Une conséquence sur ton plan à toi (glissement, périmètre, dépendances) est plus utile qu'une conséquence sur eux.`},theme:`logiciel`},{id:u(`chain-006`),mechanic:m.DETECTIVE,signature:{trapPattern:`consequence-non-affective`,theme:`rh`},scenario:`Réunion DRH : « On bascule sur le nouveau SIRH le 1er octobre. La formation des managers a été reportée trois fois et seulement 30 % d'entre eux y ont assisté à ce jour. »`,revealedComponent:`event`,revealedText:`une partie des managers pourrait ne pas savoir valider les congés et notes de frais de leurs équipes dans le nouveau SIRH dès la bascule`,expected:{cause:`un taux de formation des managers à 30 % seulement à trois mois de la bascule SIRH, après trois reports`,event:`une partie des managers pourrait ne pas savoir valider les congés et notes de frais de leurs équipes dans le nouveau SIRH dès la bascule`,consequence:`les validations seraient retardées de plusieurs jours et un volume estimé de 300 à 500 tickets remonterait au support RH sur les deux premières semaines`},defensibleVariant:{cause:`seulement 30 % des managers sont formés au nouveau SIRH, après trois reports de la session, et la bascule est dans trois mois`,event:`une partie des managers pourrait ne pas savoir valider les congés et notes de frais de leurs équipes dans le nouveau SIRH dès la bascule`,consequence:`on accumulerait un arriéré de validations sur les deux premières semaines et la paie d'octobre serait à risque pour les frais professionnels`},advice:{cause:`Un facteur factuel (taux, dates, reports), pas une impression. Le coach que tu joues s'appuie sur ce qui est mesurable.`,consequence:`Un effet opérationnel (jours, volume de tickets, paie). Le réflexe « les managers seraient frustrés » est un effet affectif, recevable mais insuffisant : c'est l'impact opérationnel qui permet d'arbitrer le traitement.`},theme:`rh`},{id:u(`chain-007`),mechanic:m.DETECTIVE,signature:{trapPattern:`evenement-conditionnel-strict`,theme:`conseil`},scenario:`Revue de portefeuille conseil : « Sur la mission Banque X, le client a remplacé son sponsor il y a quinze jours. Le nouveau ne nous a pas encore reçus et il a déjà demandé à revoir le périmètre de deux livrables. »`,revealedComponent:`consequence`,revealedText:`on devrait rejouer deux à trois semaines de cadrage et on perdrait la marge dégagée jusqu'ici sur la mission`,expected:{cause:`le remplacement récent du sponsor côté client, sans rencontre encore tenue et avec deux livrables déjà remis en question`,event:`le nouveau sponsor pourrait redéfinir significativement le périmètre de la mission`,consequence:`on devrait rejouer deux à trois semaines de cadrage et on perdrait la marge dégagée jusqu'ici sur la mission`},defensibleVariant:{cause:`un changement de sponsor il y a quinze jours, sans cadrage retenu encore avec lui, et une demande explicite de revoir deux livrables`,event:`le périmètre de la mission pourrait être substantiellement réouvert par le nouveau sponsor`,consequence:`on devrait rejouer deux à trois semaines de cadrage et on perdrait la marge dégagée jusqu'ici sur la mission`},advice:{cause:`Un fait précis (changement de sponsor, demande de revoir deux livrables), pas un sentiment. Ce sont les faits qui rendent la cause discutable en réunion.`,event:`Conditionnel obligatoire. « Le sponsor redéfinit le périmètre » au présent ferait basculer dans l'issue. Tant que la rencontre n'a pas eu lieu, c'est un événement possible : « pourrait redéfinir », « risquerait de réouvrir ».`},theme:`conseil`},{id:u(`chain-008`),mechanic:m.DETECTIVE,signature:{trapPattern:`tautologie-piege`,theme:`operations`},scenario:`Réunion logistique opérations : « On vient d'apprendre que notre transporteur principal sur l'axe Rhône-Alpes engage une grève reconductible la semaine du 15. On a 40 % de nos expéditions B2B qui passent par eux. »`,revealedComponent:`consequence`,revealedText:`on devrait reporter ou détourner environ 1 200 commandes B2B, avec un dépassement de SLA pour la moitié et une exposition à pénalités estimée entre 50 et 80 k€`,expected:{cause:`une grève reconductible annoncée chez notre transporteur principal sur l'axe Rhône-Alpes, qui couvre 40 % de nos expéditions B2B`,event:`nos expéditions B2B sur cet axe pourraient être interrompues ou fortement ralenties pendant tout ou partie de la semaine du 15`,consequence:`on devrait reporter ou détourner environ 1 200 commandes B2B, avec un dépassement de SLA pour la moitié et une exposition à pénalités estimée entre 50 et 80 k€`},defensibleVariant:{cause:`grève reconductible chez le transporteur qui assure 40 % des expéditions B2B Rhône-Alpes, annoncée pour la semaine du 15`,event:`l'acheminement de nos commandes B2B sur cet axe pourrait être stoppé plusieurs jours sans solution de repli déjà contractée`,consequence:`on devrait reporter ou détourner environ 1 200 commandes B2B, avec un dépassement de SLA pour la moitié et une exposition à pénalités estimée entre 50 et 80 k€`},advice:{cause:`Un fait daté et chiffré (annonce de grève, 40 % du volume). C'est cette précision qui rend le risque traitable, pas l'humeur générale.`,event:`Attention au piège tautologique. Écrire « on ne pourrait pas honorer nos commandes B2B » reformule la conséquence et n'apporte rien. L'événement utile décrit ce qui se passe entre la cause et la conséquence : l'acheminement s'arrête.`},theme:`operations`}],nn=Vt([`ops`,`securite`,`sre`,`produit`,`data`,`cloud`,`dev`,`ci-cd`,`pi-planning`,`mep`]),rn=F({trapPattern:P().min(1),theme:P().min(1)}),an=Bt(m.BRICKS),on=F({nature:Vt([`cause`,`constat`,`evenement`,`antecedent`]),text:P().min(10),feedback:P().min(10).optional()}),sn=F({id:P().min(1),mechanic:an,signature:rn,component:Bt(`cause`),theme:nn,candidates:Lt(on).length(4),correctNature:Bt(`cause`)}),cn=F({nature:Vt([`conditionnel`,`present-avere`,`passe-avere`,`futur-certain`]),text:P().min(10),feedback:P().min(10).optional()}),ln=F({id:P().min(1),mechanic:an,signature:rn,component:Bt(`event`),theme:nn,context:P().min(20),candidates:Lt(cn).length(4),correctNature:Bt(`conditionnel`)}),un=F({nature:Vt([`mesurable`,`tautologie`,`affect`,`abstrait`]),text:P().min(10),feedback:P().min(10).optional()}),dn=Rt(`component`,[sn,ln,F({id:P().min(1),mechanic:an,signature:rn,component:Bt(`consequence`),theme:nn,context:P().min(20),candidates:Lt(un).length(4),correctNature:Bt(`mesurable`)})]);function fn(e){return e.map((e,t)=>{let n=dn.safeParse(e);if(!n.success){let e=n.error.issues.map(e=>`${e.path.join(`.`)||`(root)`} : ${e.message}`).join(`

{nature:`antecedent`,text:`En 2024, on avait déjà lancé un checkout sans discovery et ça avait posé problème.`,feedback:`Un précédent, pas un facteur actif. La cause vit dans le contexte présent, elle pèse sur le risque de ce sprint-ci.`}]},{id:u(`bricks-cause-005`),mechanic:m.BRICKS,signature:{trapPattern:`cause-vs-constat`,theme:`data`},component:`cause`,theme:`data`,correctNature:`cause`,candidates:[{nature:`cause`,text:`Le pipeline ETL nuit dépend d'un extract SFTP d'un fournisseur qui n'a signé aucun SLA de disponibilité pour son endpoint.`},{nature:`constat`,text:`Notre chaîne data intègre plusieurs fournisseurs externes.`,feedback:`C'est une topologie, pas une cause. Un fait structurel ne devient cause qu'en pointant précisément ce qui coince.`},{nature:`evenement`,text:`Le pipeline pourrait tomber en échec une nuit sans qu'on récupère à temps.`,feedback:`Ça, c'est l'événement redouté. La cause explique pourquoi cette panne devient probable maintenant.`},{nature:`antecedent`,text:`En janvier, l'endpoint SFTP du fournisseur avait déjà été indisponible deux nuits.`,feedback:`Ce serait une cause si l'incident se répétait ou si rien n'avait été corrigé. Formulé au passé isolé, c'est un récit.`}]},{id:u(`bricks-cause-006`),mechanic:m.BRICKS,signature:{trapPattern:`cause-vs-antecedent`,theme:`cloud`},component:`cause`,theme:`cloud`,correctNature:`cause`,candidates:[{nature:`cause`,text:`La politique IAM du compte production a été ouverte à un rôle admin partagé lors du dernier hotfix et n'a pas été refermée depuis.`},{nature:`constat`,text:`Notre gouvernance IAM n'est pas au niveau attendu.`,feedback:`Une évaluation globale, pas un facteur. Une cause s'écrit avec un sujet précis et un verbe qui décrit un état actif.`},{nature:`evenement`,text:`Un rôle admin partagé pourrait servir à une action non tracée.`,feedback:`Vous décrivez déjà ce qui pourrait arriver. La cause est ce qui rend cette action non tracée possible aujourd'hui.`},{nature:`antecedent`,text:`Il y a es.`,feedback:`Un précédent utile en rétrospective mais pas actif sur le risque présent. La cause est la temporalité de ce token-ci.`}]}],mn=[{id:u(`bricks-event-001`),mechanic:m.BRICKS,signature:{trapPattern:`conditionnel-vs-avere`,theme:`pi-planning`},component:`event`,theme:`pi-planning`,correctNature:`conditionnel`,context:`En PI Planning, l'équipe Paiement dépend d'un module d'authentification livré par l'équipe Plateforme. Le scope SSO externe n'a pas été explicitement engagé côté Plateforme.`,candidates:[{nature:`conditionnel`,text:`L'équipe Plateforme pourrait livrer son module sans le scope SSO externe attendu par l'équipe Paiement.`},{nature:`present-avere`,text:`L'équipe Plateforme livre son module sans le scope SSO externe.`,feedback:`Formulé au présent, c'est un fait constaté, donc une issue à traiter, pas un risque à anticiper. Le conditionnel installe l'incertitude.`},{nature:`passe-avere`,text:`L'équipe Plateforme a déjà livré un module sans le scope attendu au PI précédent.`,feedback:`C'est un antécédent, utile pour argumenter la probabilité, mais l'événement du risque doit parler du futur possible, pas du passé.`},{nature:`futur-certain`,text:`L'équipe Plateforme livrera son module sans le scope SSO externe.`,feedback:`Le futur simple affirme la certitude, or un risque suppose que ça peut ne pas arriver. Le conditionnel ouvre la porte à l'incertitude.`}]},{id:u(`bricks-event-002`),mechanic:m.BRICKS,signature:{trapPattern:`conditionnel-vs-avere`,theme:`mep`},component:`event`,theme:`mep`,correctNature:`conditionnel`,context:`La MEP de la nouvelle console de facturation est prévue vendredi soir. La formation des ops a été reportée trois fois et 30 % d'entre eux seulement l'ont suivie.`,candidates:[{nature:`conditionnel`,text:`Une partie des ops pourrait ne pas savoir dépanner un incident sur la nouvelle console dès la bascule.`},{nature:`present-avere`,text:`Les ops ne savent pas dépanner la nouvelle console.`,feedback:`Vous constatez, vous ne formulez pas un risque. Sans le conditionnel, l'événement bascule en issue déjà là.`},{nature:`passe-avere`,text:`Les ops n'ont pas su dépanner la nouvelle console lors du pilote.`,feedback:`Un fait passé, informatif mais pas prospectif. L'événement du risque regarde vers vendredi soir, pas vers le pilote.`},{nature:`futur-certain`,text:`Les ops seront dépassés vendredi soir.`,feedback:`Le futur simple affirme la survenue, ce qui gomme l'incertitude. Un risque ne se formule pas comme une prédiction sûre.`}]},{id:u(`bricks-event-003`),mechanic:m.BRICKS,signature:{trapPattern:`conditionnel-vs-futur`,theme:`securite`},component:`event`,theme:`securite`,correctNature:`conditionnel`,context:`Une bibliothèque JS critique de notre front est marquée deprecated depuis juin. L'équipe n'a pas encore planifié le remplacement dans le prochain sprint.`,candidates:[{nature:`conditionnel`,text:`Une faille non corrigée sur cette bibliothèque pourrait être exploitée sans qu'on puisse patcher rapidement.`},{nature:`present-avere`,text:`Une faille non corrigée sur cette bibliothèque est exploitée.`,feedback:`Au présent, c'est un incident en cours, donc une issue de sécurité à contenir maintenant. Le risque parle de ce qui n'est pas encore arrivé.`},{nature:`passe-avere`,text:`Une faille sur cette bibliothèque a été exploitée l'an dernier chez un concurrent.`,feedback:`Un précédent externe, utile pour argumenter, mais l'événement d'un risque projette une occurrence possible chez vous, pas chez autrui.`},{nature:`futur-certain`,text:`Cette bibliothèque va nous causer un incident de sécurité.`,feedback:`Le futur simple pose la certitude et brûle la marge de manœuvre. Le conditionnel garde ouvert le fait qu'on peut agir avant.`}]},{id:u(`bricks-event-004`),mechanic:m.BRICKS,signature:{trapPattern:`conditionnel-vs-futur`,theme:`sre`},component:`event`,theme:`sre`,correctNature:`conditionnel`,context:`Sur le cluster Kubernetes de prod, une sonde CPU du node exporter renvoie des valeurs aberrantes une nuit sur cinq depuis lundi. L'équipe n'a pas encore isolé la cause.`,candidates:[{nature:`conditionnel`,text:`Un incident de saturation CPU pourrait passer sous les radars faute d'alerte fiable au bon seuil.`},{nature:`present-avere`,text:`Un incident de saturation CPU passe sous les radars.`,feedback:`Formulation au présent, c'est un problème déjà en cours, une issue. Un risque anticipe, il ne constate pas.`},{nature:`passe-avere`,text:`Un incident de saturation CPU est passé sous les radars la semaine dernière.`,feedback:`Un fait passé qui aurait dû déclencher un postmortem. Le risque, lui, parle des semaines à venir sous les mêmes conditions.`},{nature:`futur-certain`,text:`Un incident CPU va passer sous les radars.`,feedback:`Le futur simple retire l'incertitude, or l'incertitude est le cœur du risque. Le conditionnel dit possible, pas garanti.`}]},{id:u(`bricks-event-005`),mechanic:m.BRICKS,signature:{trapPattern:`conditionnel-vs-avere`,theme:`produit`},component:`event`,theme:`produit`,correctNature:`conditionnel`,context:`Le nouveau plan tarifaire s'active dans trois semaines côté produit. Le script de réponses types du support n'est pas finalisé et aucune session de formation n'a eu lieu.`,candidates:[{nature:`conditionnel`,text:`Le support pourrait être submergé par des tickets auxquels il ne saurait pas répondre dans les 48 premières heures.`},{nature:`present-avere`,text:`Le support est submergé par des tickets sans réponse.`,feedback:`C'est un constat au présent, une issue à traiter tout de suite. Le risque parle du lancement à venir, pas d'un état actuel.`},{nature:`passe-avere`,text:`Le support a été submergé au dernier lancement produit.`,feedback:`Un antécédent utile pour argumenter la probabilité mais l'événement du risque doit se projeter sur ce lancement-ci.`},{nature:`futur-certain`,text:`Le support sera débordé au lancement.`,feedback:`Le futur simple ferme la porte à l'action préventive en affirmant la survenue. Le conditionnel garde l'événement incertain.`}]},{id:u(`bricks-event-006`),mechanic:m.BRICKS,signature:{trapPattern:`conditionnel-vs-futur`,theme:`cloud`},component:`event`,theme:`cloud`,correctNature:`conditionnel`,context:`Notre fournisseur cloud principal a annoncé une fenêtre de maintenance non planifiée sur eu-west-3 la semaine prochaine. Environ 40 % de nos workloads B2B tournent sur cette région.`,candidates:[{nature:`conditionnel`,text:`Une partie de nos workloads B2B pourrait être indisponible pendant la fenêtre de maintenance sans plan de bascule prêt.`},{nature:`present-avere`,text:`Une partie de nos workloads B2B est indisponible.`,feedback:`Formulé au présent, c'est une issue en cours, pas un risque à anticiper. La maintenance n'a pas encore eu lieu.`},{nature:`passe-avere`,text:`Une partie de nos workloads B2B a été indisponible lors de la précédente maintenance.`,feedback:`Un précédent, pas un événement à venir. Le risque projette une nouvelle occurrence, il ne relate pas la précédente.`},{nature:`futur-certain`,text:`Nos workloads B2B seront indisponibles pendant la maintenance.`,feedback:`Le futur simple affirme la certitude, ce qui exclut toute stratégie de mitigation. Le conditionnel maintient la marge d'action.`}]}],hn=[{id:u(`bricks-cons-001`),mechanic:m.BRICKS,signature:{trapPattern:`mesurable-vs-tautologie`,theme:`produit`},component:`consequence`,theme:`produit`,correctNature:`mesurable`,context:`Cause : la PO du Portail Client part en congé maternité fin août sans PO relais identifié. Événement : la priorisation du backlog Portail Client pourrait rester bloquée pendant plusieurs sprints.`,candidates:[{nature:`mesurable`,text:`Deux à trois sprints de vélocité produit seraient dépriorisés, avec un décalage estimé de six semaines sur la livraison du chantier Portail Client.`},{nature:`tautologie`,text:`La priorisation du backlog serait bloquée.`,feedback:`Vous répétez l'événement au lieu d'en raconter l'effet. Une conséquence dit ce qui se passe après, avec du concret.`},
